[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gaplike"
version = "1.0.0"
description = "Gapped/windowed stationary Gaussian inference: gap-pattern generation, windowed frequency-domain covariances, and exact accelerated time-domain likelihoods"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Federico Pozzoli" },
  { name = "Ollie Burke" },
]
keywords = ["LISA", "gravitational waves", "data gaps", "window functions", "Whittle likelihood", "Toeplitz"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
]

[project.optional-dependencies]
# full paper pipeline: sampling + corner plots (lisabeta must be installed
# separately, see README)
pe = ["emcee>=3", "corner", "matplotlib"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
