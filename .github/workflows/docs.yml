name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# needed by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; never cancel one half-way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build
        # -W turns warnings into errors: a broken cross-reference or a
        # malformed docstring fails the build instead of quietly degrading.
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # pull requests build the docs but do not publish them
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
